<div class="py-16 px-4 sm:px-6 lg:px-8 bg-background-light dark:bg-background-dark">
  <h2 class="text-black dark:text-white text-3xl font-bold leading-tight tracking-[-0.015em] text-center mb-12">Colecciones Destacadas</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-7xl mx-auto">
    @for (item of collections; track $index) {
      <div
            class="group relative bg-cover bg-center flex flex-col rounded-xl justify-end p-6 aspect-w-3 aspect-h-4 overflow-hidden"
            [attr.data-alt]="item.alt"
            [style.background-image]="'linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 50%), url(' + item.imageUrl + ')'"
          >
            <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition-colors duration-300"></div>
            <div class="relative translate-y-8 group-hover:translate-y-0 transition-transform duration-500 ease-in-out">
              <p class="text-white text-xl font-bold leading-tight line-clamp-2">{{ item.title }}</p>

              <p-button
                label="Ver más"
                [link]="true"
                styleClass="text-accent font-bold mt-2 p-0"
              />
            </div>
      </div>
    }
  </div>
</div>
