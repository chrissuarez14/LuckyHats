<div class="py-16 px-4 sm:px-6 lg:px-8 bg-background-light dark:bg-background-dark">
  <h2 class="text-black dark:text-white text-3xl font-bold leading-tight tracking-[-0.015em] text-center mb-12">Testimonios</h2>

  <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

    @for (item of testimonials; track $index) {
      <p-card
        styleClass="bg-gray-100 dark:bg-gray-900 rounded-xl shadow-lg"
      >
        <ng-template pTemplate="header">
          <div class="flex items-center mb-4 p-6 pb-0">
            <p-avatar
              [image]="item.image"

              size="large"
              shape="circle"
              styleClass="mr-4"
            />
            <div>
              <p class="font-bold text-black dark:text-white">{{ item.name }}</p>
              <p class="text-sm text-gray-500 dark:text-gray-400">{{ item.handle }}</p>
            </div>
          </div>
        </ng-template>

        <p class="text-gray-600 dark:text-gray-300 px-6 pb-6 m-0">
          {{ item.quote }}
        </p>
      </p-card>
    }

  </div>
</div>
